name: Collect additional official food data
on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services, separated by spaces; all seven by default'
        required: true
        default: 'I0490 I0580 I1020 I2520 C005 I1250 C002'
      source_snapshot:
        description: 'main or an existing data/foodsafety-RUN-ATTEMPT branch to preserve'
        required: true
        default: 'main'
      reuse_source:
        description: 'Reprocess preserved official originals without new API requests'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: foodhannun-data-refresh
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated data snapshot branch
        env:
          DATA_BRANCH: data/foodsafety-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SNAPSHOT: ${{ inputs.source_snapshot }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$SOURCE_SNAPSHOT" != 'main' ]; then
            if [[ ! "$SOURCE_SNAPSHOT" =~ ^data/foodsafety-[0-9]+-[0-9]+$ ]]; then exit 2; fi
            git fetch origin "$SOURCE_SNAPSHOT"
            git restore --source=FETCH_HEAD --staged --worktree -- data/collection
          fi
          git switch -c "$DATA_BRANCH"
          echo "DATA_BRANCH=$DATA_BRANCH" >> "$GITHUB_ENV"
      - name: Collect sequentially with one existing API key
        env:
          FOODSAFETY_API_KEY: ${{ secrets.FOODSAFETY_API_KEY }}
          SELECTED_SERVICES: ${{ inputs.services }}
          REUSE_SOURCE: ${{ inputs.reuse_source }}
        shell: bash
        run: |
          failed=0
          extra_flags=()
          if [ "$REUSE_SOURCE" = 'true' ]; then extra_flags=(--reuse-source); fi
          for service in $SELECTED_SERVICES; do
            case "$service" in I0490|I0580|I1020|I2520|C005|I1250|C002) ;; *) echo 'Unsupported service'; exit 2 ;; esac
            if python3 scripts/collect-foodsafety.py --service "$service" --output "data/collection/$service" "${extra_flags[@]}"; then
              python3 scripts/validate-foodsafety.py --service "$service"
            else
              failed=1
            fi
            python3 scripts/build-data-status.py
            git add "data/collection/$service" data/collection-status.json data-status.html
            if ! git diff --cached --quiet; then
              git commit -m "data: collect verified $service snapshot and actual status"
              git push origin "HEAD:$DATA_BRANCH"
            fi
            sleep 3
          done
          echo "Collected snapshots are on $DATA_BRANCH; production main is unchanged."
          exit "$failed"
      - name: Keep raw snapshots and explicit collection status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-safety-complete-snapshots
          path: |
            data/collection/
            data/collection-status.json
            data-status.html
          retention-days: 30
          if-no-files-found: warn
