name: Collect additional official food data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    name: Collect ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service: [I1020, I2520, I1250, C002, I0490, I0580, C005]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect complete official dataset
        env:
          FOODSAFETY_API_KEY: ${{ secrets.FOODSAFETY_API_KEY }}
        run: python3 scripts/collect-foodsafety.py --service '${{ matrix.service }}' --output 'collection/${{ matrix.service }}'
      - name: Keep verified data and explicit collection status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-data-${{ matrix.service }}
          path: |
            collection/${{ matrix.service }}/status.json
            collection/${{ matrix.service }}/records*.jsonl.gz
          retention-days: 30
          if-no-files-found: warn
