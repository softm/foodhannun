name: Build review nutrition snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  nutrition:
    if: github.ref == 'refs/heads/feat/complete-food-data-collection'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-data.txt
      - run: python3 scripts/sync-nutrition.py
      - run: python3 scripts/validate-food-data.py
      - run: python3 scripts/build-data-status.py
      - name: Save verified data to the isolated review branch
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/feat/complete-food-data-collection"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nutrition data/collection-status.json data-status.html
          git commit -m "data: collect and validate 348k official nutrition records" || exit 0
          git push origin HEAD:refs/heads/feat/complete-food-data-collection
      - uses: actions/upload-artifact@v4
        with:
          name: complete-official-nutrition
          path: data/nutrition/
          retention-days: 30
