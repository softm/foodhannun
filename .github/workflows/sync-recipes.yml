name: Sync FoodSafety recipes (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: foodhannun-data-refresh
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The daily schedule is owned only by sync-food-data.yml.
      - name: Collect recipes and validate related data
        id: collection
        env:
          FOODSAFETY_API_KEY: ${{ secrets.FOODSAFETY_API_KEY }}
        run: python3 scripts/refresh-food-data.py --mode recipes
      - name: Publish and request Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-food-data.py --mode recipes
      - if: steps.collection.outputs.collection_failed == 'true'
        run: exit 1
