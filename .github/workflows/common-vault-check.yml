name: Verify common vault integration
on:
  pull_request:
  push:
    branches: [main]
    paths: ['index.html','docs/COMMON-VAULT.md','.github/workflows/common-vault-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing application regression checks
        run: |
          node --check assets/app.js
          node --test tests/*.test.js
